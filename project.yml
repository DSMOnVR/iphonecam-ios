name: iPhoneCam
options:
  bundleIdPrefix: com.iphonecam
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  iPhoneCam:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: iPhoneCam
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iphonecam.app
        PRODUCT_NAME: iPhoneCam
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        SUPPORTS_MACCATALYST: "NO"
    info:
      path: iPhoneCam/Info.plist
      properties:
        CFBundleDisplayName: iPhoneCam
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: "iPhoneCam uses the camera to stream video to your PC."
        NSMicrophoneUsageDescription: "iPhoneCam may use the microphone while streaming."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
schemes:
  iPhoneCam:
    build:
      targets:
        iPhoneCam: all
    run:
      config: Release
